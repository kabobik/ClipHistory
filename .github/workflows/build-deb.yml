name: Build deb package

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - VERSION
      - cliphistory_new.py
      - clipshow_qt.py
      - config.json
      - scripts/build-deb.sh
      - .github/workflows/build-deb.yml

permissions:
  contents: write

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deb package
        run: bash scripts/build-deb.sh

      - name: Verify package version
        run: |
          version="$(tr -d '\n\r' < VERSION)"
          package="cliphistory_${version}_all.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          dpkg-deb -c "$package" | grep -q './opt/cliphistory/VERSION'

      - name: Commit built package
        run: |
          version="$(tr -d '\n\r' < VERSION)"
          package="cliphistory_${version}_all.deb"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$package"

          if git diff --cached --quiet; then
            echo "Package is already up to date."
            exit 0
          fi

          git commit -m "Build ClipHistory ${version} deb package [skip ci]"
          git push
